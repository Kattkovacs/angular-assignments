<a ui-sref="home">Home</a> &lt; <span>Categories List</span>
<h3>Categories List</h3>
<ul>
	<li ng-repeat="category in categories.items track by category.id">
		<a ui-sref="items({ categoryShortName: category.short_name })">
			{{ category.name }} ({{ category.short_name }})
		</a>
	</li>
</ul>
